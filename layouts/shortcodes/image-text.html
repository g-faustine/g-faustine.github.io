<div style="display: flex; gap: 20px; align-items: center; flex-wrap: wrap;">
    {{ $image := .Get "image" }}{{ $alt := .Get "alt" }}{{ $width := .Get "width" | default "300px" }}
    <img src="{{ $image }}" alt="{{ $alt }}" style="flex: 0 0 {{ $width }}; height: 200px; object-fit: cover;">
    <div style="flex: 1; min-width: 250px;">
        {{ .Inner | markdownify }}
    </div>
</div>
