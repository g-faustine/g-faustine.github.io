{{ $folder := .Get "folder" }}
{{ $height := .Get "height" | default "150px" }}
{{ $maxWidth := .Get "maxWidth" | default "200px" }}
{{ $pattern := printf "%s/*.jpg" $folder }}
<div class="gallery-grid" style="grid-template-columns: repeat(auto-fill, minmax({{ $maxWidth }}, 1fr));">
    {{ range (.Page.Resources.Match $pattern) }}
    <div class="gallery-item">
        <a href="{{ .RelPermalink }}" data-lightbox="gallery" data-title="{{ .Title }}">
            <img src="{{ .RelPermalink }}" alt="{{ .Title }}" style="height: {{ $height }};">
        </a>
        <!-- Optional: Visible caption below the image -->
        <p class="gallery-caption">{{ .Title }}</p>
    </div>
    {{ end }}
</div>

<style>
    .gallery-grid {
        display: grid;
        gap: 20px;
        padding: 10px;
    }

    .gallery-item {
        overflow: hidden;
        border-radius: 0px;
    }

    .gallery-item img {
        width: 100%;
        object-fit: cover;
        display: block;
        margin: 0;
    }

    .gallery-caption {
        margin: 0;
        padding-top: 4px;
        text-align: center;
        font-size: 14px;
        color: #555;
        line-height: 1.2;
    }
</style>
