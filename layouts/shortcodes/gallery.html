<div class="gallery-grid">
    {{ range .Page.Resources.Match "*.jpg" }}
    <div class="gallery-item">
        <a href="{{ .RelPermalink }}" data-lightbox="gallery" data-title="{{ .Title }}">
            <img src="{{ .RelPermalink }}" alt="{{ .Title }}">
        </a>
        <!-- Optional: Visible caption below the image -->
        <p class="gallery-caption">{{ .Title }}</p>
    </div>
    {{ end }}
</div>

<style>
    .gallery-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
        gap: 10px;
        padding: 10px;
    }

    .gallery-item {
        overflow: hidden;
        border-radius: 4px;
    }

    .gallery-item img {
        width: 100%;
        height: 200px;
        object-fit: cover;
    }

    .gallery-caption {
        margin: 5px 0 0;
        text-align: center;
        font-size: 14px;
        color: #555;
    }
</style>
