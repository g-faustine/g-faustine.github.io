<div class="gallery-grid">
    {{ $folder := .Get "folder" }}
    {{ $pattern := printf "%s/*.jpg" $folder }}
    {{ range (.Page.Resources.Match $pattern) }}
    <div class="gallery-item">
        <a href="{{ .RelPermalink }}" data-lightbox="gallery" data-title="{{ .Title }}">
            <img src="{{ .RelPermalink }}" alt="{{ .Title }}">
        </a>
        <!-- Optional: Visible caption below the image -->
        <p class="gallery-caption">{{ .Title }}</p>
    </div>
    {{ end }}
</div>

<style>
    .gallery-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        gap: 20px;
        padding: 10px;
    }

    .gallery-item {
        overflow: hidden;
        border-radius: 0px;
    }

    .gallery-item img {
        width: 100%;
        height: 150px;
        object-fit: cover;
        display: block;
        margin: 0;
    }

    .gallery-caption {
        margin: 0;
        padding-top: 4px;
        text-align: center;
        font-size: 14px;
        color: #555;
        line-height: 1.2;
    }
</style>
